name: CI
on:
  # Only on main for pushes — a PR from a branch in this repo would otherwise
  # run the full job twice per commit (once for push, once for pull_request).
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Chromatic needs full git history to find a baseline commit to
          # diff against — the default shallow (depth-1) clone leaves it
          # with only the current commit and it refuses to run.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Dependency security gate. This is pnpm's BUILT-IN audit subcommand,
      # not the repo's `pnpm run audit` script (that one is Lighthouse via
      # `lhci autorun`) — the shared name is a known ambiguity, so keep this
      # step's name explicit. Blocks the job on any high/critical finding in
      # production dependencies; runs early to short-circuit cheaply.
      - name: Dependency security audit
        run: pnpm audit --prod --audit-level=high
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the lockfile so a Playwright version bump busts it; a hit
          # lets `playwright install` skip the ~1-2 min browser download.
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - run: pnpm test
      # Runs the screenshot project too, but only so Chromatic archives the
      # pages — the local pixelmatch diff self-skips under CI (see
      # screenshot.test.ts), so no baseline reset/reseed is needed here.
      # Chromatic (below) is the real cross-environment visual gate.
      - run: pnpm test:visual
      - run: pnpm run audit
      # Hand the Playwright-generated page archives to the `chromatic` job
      # below. test:visual produced them via @chromatic-com/playwright's
      # fixture teardown; `npx chromatic --playwright` only packages and
      # uploads them, so the gate itself doesn't need this job's build.
      - name: Upload Chromatic archives
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: chromatic-archives
          path: test-results/chromatic-archives
          retention-days: 1

  # Publishes the Chromatic build. It is NOT the gate anymore — the Chromatic
  # GitHub App's own "UI Tests" commit status is the required check
  # (docs/decisions/2026-07-10-visual-approval-policy.md). This job only
  # uploads the archives so a build exists for the App to report on; approving
  # a diff in the Chromatic UI flips "UI Tests" green with NO CI re-run. Hence
  # `--exit-zero-on-changes`: visual diffs must not fail this job (the App
  # holds the block), but a genuine publish failure (bad token, upload error)
  # still exits non-zero and surfaces here. Runs OUTSIDE verify-all so a
  # Chromatic outage can't hold the rest of CI hostage. A missing token fails
  # loudly rather than silently skipping — a skipped upload means the App
  # never posts "UI Tests", and that required check stays red (fail-closed).
  # (Fork PRs never receive repo secrets by GitHub design; accepted for this
  # solo-maintained repo — revisit before inviting external contributions.)
  chromatic:
    if: github.event_name == 'pull_request'
    needs: verify-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so Chromatic can locate a baseline commit, same as
          # verify-all's checkout.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download Chromatic archives
        uses: actions/download-artifact@v4
        with:
          name: chromatic-archives
          path: test-results/chromatic-archives
      - name: Publish Chromatic build
        # Bound the step so a Chromatic Capture-Cloud stall fails fast instead
        # of hanging until the 6h job default. This happened three times on
        # 2026-07-10/11 (across commits, incl. one pre-existing) — each run sat
        # in_progress 15–70 min with no build ever reported. A healthy
        # publish+build is ~2–4 min, so 10 leaves generous headroom.
        # (Follow-up worth considering now the App is installed: add
        # `--exit-once-uploaded` so the CLI returns right after upload and the
        # App posts "UI Tests" from the build independently — that removes the
        # wait entirely rather than just bounding it.)
        timeout-minutes: 10
        run: |
          if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "CHROMATIC_PROJECT_TOKEN is unset — cannot publish a build; the App's 'UI Tests' check will never post. Failing closed."
            exit 1
          fi
          # --exit-zero-on-changes: diffs don't fail this job; the Chromatic
          # GitHub App's "UI Tests" required check is the gate. Publish/upload
          # failures still exit non-zero.
          npx chromatic --playwright --exit-zero-on-changes
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
