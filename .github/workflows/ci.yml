name: CI
on:
  # Only on main for pushes — a PR from a branch in this repo would otherwise
  # run the full job twice per commit (once for push, once for pull_request).
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Chromatic needs full git history to find a baseline commit to
          # diff against — the default shallow (depth-1) clone leaves it
          # with only the current commit and it refuses to run.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Dependency security gate. This is pnpm's BUILT-IN audit subcommand,
      # not the repo's `pnpm run audit` script (that one is Lighthouse via
      # `lhci autorun`) — the shared name is a known ambiguity, so keep this
      # step's name explicit. Blocks the job on any high/critical finding in
      # production dependencies; runs early to short-circuit cheaply.
      - name: Dependency security audit
        run: pnpm audit --prod --audit-level=high
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the lockfile so a Playwright version bump busts it; a hit
          # lets `playwright install` skip the ~1-2 min browser download.
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - run: pnpm test
      # Runs the screenshot project too, but only so Chromatic archives the
      # pages — the local pixelmatch diff self-skips under CI (see
      # screenshot.test.ts), so no baseline reset/reseed is needed here.
      # Chromatic (below) is the real cross-environment visual gate.
      - run: pnpm test:visual
      - run: pnpm run audit
      # BLOCKING visual gate — the single authoritative visual approval
      # mechanism (docs/decisions/2026-07-10-visual-approval-policy.md).
      # Unapproved visual diffs fail the job; deliberate changes are approved
      # in the Chromatic UI, then the check re-runs green. A missing token on
      # a PR fails loudly rather than silently skipping — a skipped gate is a
      # bypassed gate. (Fork PRs never receive repo secrets by GitHub design;
      # accepted for this solo-maintained repo — revisit before inviting
      # external contributions.)
      - name: Chromatic visual gate
        if: github.event_name == 'pull_request'
        run: |
          if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "CHROMATIC_PROJECT_TOKEN is unset — visual gate cannot run; failing closed."
            exit 1
          fi
          npx chromatic --playwright
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
