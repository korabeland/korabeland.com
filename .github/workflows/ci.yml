name: CI
on:
  # Only on main for pushes — a PR from a branch in this repo would otherwise
  # run the full job twice per commit (once for push, once for pull_request).
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Chromatic needs full git history to find a baseline commit to
          # diff against — the default shallow (depth-1) clone leaves it
          # with only the current commit and it refuses to run.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Dependency security gate. This is pnpm's BUILT-IN audit subcommand;
      # the repo's Lighthouse script is now named `pnpm run lighthouse` (was
      # `pnpm run audit` — renamed to end the shared-name ambiguity). Blocks the
      # job on any high/critical finding in production dependencies; runs early
      # to short-circuit cheaply.
      - name: Dependency security audit
        run: pnpm audit --prod --audit-level=high
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the lockfile so a Playwright version bump busts it; a hit
          # lets `playwright install` skip the ~1-2 min browser download.
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - run: pnpm test
      # Runs the screenshot project too, but only so Chromatic archives the
      # pages — the local pixelmatch diff self-skips under CI (see
      # screenshot.test.ts), so no baseline reset/reseed is needed here.
      # Chromatic (below) is the real cross-environment visual gate.
      - run: pnpm test:visual
      - run: pnpm run lighthouse
      # Production-build smoke: everything above runs against `pnpm dev`, so
      # the serverless bundle Vercel actually deploys was never exercised
      # before merge. This step imports the built function entry (emitted by
      # the lighthouse step's `pnpm build` just above — keep the ordering) and
      # asserts SSR semantics from the production bundle. A step inside
      # verify-all rather than its own job: it reuses the existing build and
      # is blocking under the one required check with no branch-protection
      # change.
      - run: pnpm smoke:production
      # Hand the Playwright-generated page archives to the `chromatic` job
      # below. test:visual produced them via @chromatic-com/playwright's
      # fixture teardown; `npx chromatic --playwright` only packages and
      # uploads them, so the gate itself doesn't need this job's build.
      - name: Upload Chromatic archives
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: chromatic-archives
          path: test-results/chromatic-archives
          retention-days: 1

  # Publishes the Chromatic build as a reviewable visual record. There is NO
  # human visual-approval gate: the AI agent reviews visual changes (from the
  # published build or a local capture) and flags only genuine regressions
  # (docs/decisions/2026-07-10-visual-approval-policy.md, amended 2026-07-12 (c)).
  # `--exit-zero-on-changes` is deliberate — visual diffs must not fail this
  # job — but a genuine publish failure (bad token, upload error) still exits
  # non-zero. This `chromatic` job runs on every PR as part of the pipeline but
  # is NOT a required check (dropped from branch protection 2026-07-12), so a
  # Chromatic outage or publish failure can never block a merge — it just
  # surfaces as a failed non-blocking job the agent notices. Runs OUTSIDE
  # verify-all so it can't slow the rest of CI. A missing token fails this job
  # loudly rather than skipping silently — a red job flags "no record to
  # review" without gating the merge.
  # (Fork PRs never receive repo secrets by GitHub design; accepted for this
  # solo-maintained repo — revisit before inviting external contributions.)
  chromatic:
    if: github.event_name == 'pull_request'
    needs: verify-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so Chromatic can locate a baseline commit, same as
          # verify-all's checkout.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download Chromatic archives
        uses: actions/download-artifact@v4
        with:
          name: chromatic-archives
          path: test-results/chromatic-archives
      - name: Publish Chromatic build
        # Bound the step so a Chromatic Capture-Cloud stall fails fast instead
        # of hanging until the 6h job default. This happened three times on
        # 2026-07-10/11 (across commits, incl. one pre-existing) — each run sat
        # in_progress 15–70 min with no build ever reported. A healthy
        # publish+build is ~2–4 min, so 10 leaves generous headroom.
        # (Follow-up: `--exit-once-uploaded` would return right after upload
        # instead of waiting for the capture/build to finish, removing the wait
        # entirely rather than just bounding it — the build stays reviewable in
        # Chromatic either way.)
        timeout-minutes: 10
        run: |
          if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "CHROMATIC_PROJECT_TOKEN is unset — cannot publish a build; no visual record to review. Failing closed."
            exit 1
          fi
          # --exit-zero-on-changes: visual diffs don't fail this job; the AI
          # agent reviews the published build (no human approval gate, see ADR
          # amendment (c)). Publish/upload failures still exit non-zero.
          npx chromatic --playwright --exit-zero-on-changes
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
